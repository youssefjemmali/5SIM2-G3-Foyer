version: '2'

services:
  foyer-app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: ["java", "-jar", "/app/target/Foyer-0.0.1-SNAPSHOT.jar"]

  mysql_db:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ""  
      MYSQL_DATABASE: foyer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
