version: '2'
services:
  mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    volumes:
      - "17341b6df21301a1c0974873c621e577db1a8846108b6981874d0e144c4cdbd3:/var/lib/mysql"  # Use the old MySQL volume
  sonarqube:
    image: sonarqube:8.9.7-community
    ports:
      - "9000:9000"
      - "9092:9092"
    volumes:
      - 'sonarqube_data:/opt/sonarqube/data'
      - 'sonarqube_extensions:/opt/sonarqube/extensions'
      - 'sonarqube_logs:/opt/sonarqube/logs'
  nexus:
    image: sonatype/nexus3
    ports:
      - "8081:8081"
    volumes:
      - "95a8cc0f2655a338fbac3008def0b00c3bca1872218f7f16e6113a0178f5236b:/nexus-data"  # Use the old Nexus volume
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - "prometheus_data:/prometheus"
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - "grafana_data:/var/lib/grafana"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  17341b6df21301a1c0974873c621e577db1a8846108b6981874d0e144c4cdbd3:
    external: true
  95a8cc0f2655a338fbac3008def0b00c3bca1872218f7f16e6113a0178f5236b:
    external: true
  prometheus_data:
  grafana_data:
