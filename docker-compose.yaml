version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  springboot-app:
    image: "223jmt0040/marwenhammami-5sim2-g3-foyer"
    depends_on:
      - mysql
    ports:
      - "8089:8089"
volumes:
  mysql-data:

